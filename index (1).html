<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark War Survival - Alliance Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #2c1e10; }
        
        .ui-panel {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(30, 20, 10, 0.9); padding: 15px;
            border-radius: 8px; border: 2px solid #f0c05a;
            color: #f0c05a; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <strong style="font-size: 18px;">ALLIANCE TACTICAL</strong>
        <div id="coords" style="font-size: 12px; margin-top: 5px; color: #fff;">Klik for at sætte marker</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 2,
            attributionControl: false
        });

        // HER ER TRICKET: Vi bruger navnet på din fil direkte!
        // Sørg for at filen hedder præcis "map.jpg" på GitHub.
        var bounds = [[0, 0], [1000, 1000]];
        var image = L.imageOverlay('map.jpg', bounds).addTo(map);
        map.fitBounds(bounds);

        map.on('click', function(e) {
            var x = Math.round(e.latlng.lng);
            var y = Math.round(e.latlng.lat);
            document.getElementById('coords').innerHTML = "X: " + x + " | Y: " + y;

            var note = prompt("Navn/Alliance:");
            if (note) {
                L.circleMarker(e.latlng, {
                    radius: 10,
                    fillColor: "#f0c05a",
                    color: "#000",
                    weight: 2,
                    fillOpacity: 0.9
                }).addTo(map).bindPopup("<b>" + note + "</b><br>X: " + x + " Y: " + y).openPopup();
            }
        });
    </script>
</body>
</html>
