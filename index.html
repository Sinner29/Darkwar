<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark War - Undo & Redo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        :root { 
            --bg-color: #d8a06f; 
            --port-green: #5aab61; 
            --port-yellow: #f1c40f; 
            --glow-blue-dark: rgba(22, 114, 120, 0.45);
            --glow-border: #1abc9c;
            --panel: #2d2d2d; 
            --grid-line: rgba(0,0,0,0.15); 
        }
        
        body { font-family:sans-serif; background:var(--bg-color); color:#333; margin:0; overflow:hidden; height:100vh; touch-action:none; }
        
        .controls { position:fixed; top:0; left:0; right:0; background:var(--panel); padding:10px; display:flex; flex-direction:column; gap:8px; z-index:1000; border-bottom:2px solid #555; }
        .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content: center; }
        
        input, button { padding:10px; border-radius:4px; border:none; font-size:12px; background:#444; color:white; min-width: 35px; cursor: pointer; }
        #pIn { flex-grow: 1; min-width: 100px; }
        
        .color-btn { width: 35px; height: 35px; border-radius: 0; border: 2px solid transparent; cursor: pointer; box-sizing: border-box; }
        .color-btn.active { border-color: white; }

        #viewport { width:100vw; height:100vh; position:relative; background: var(--bg-color); overflow: hidden; }
        #zoom-layer { position:absolute; transform-origin: 0 0; width:5000px; height:5000px; }
        
        #grid { 
            width:100%; height:100%; 
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-position: -0.5px -0.5px;
        }

        .obj { 
            position:absolute; 
            display:flex; 
            align-items:center; 
            justify-content:center; 
            font-weight:bold; 
            text-align:center; 
            font-size:9px; 
            box-sizing: border-box; 
            z-index:10; 
            border-radius: 0 !important;
            color: #2c3e50;
            text-shadow: none !important;
        }
        
        .port { width:40px; height:40px; outline: 1px solid rgba(255,255,255,0.3); outline-offset: -1px; }
        .tile-blue { width:20px; height:20px; background: var(--glow-blue-dark); outline: 1px solid var(--glow-border); outline-offset: -1px; }

        .dragging { opacity: 0.8; z-index: 1000 !important; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        #modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:2000; display:none; align-items:center; justify-content:center; }
        .m-box { background:#333; padding:20px; border-radius:10px; width:85%; max-width: 300px; display:flex; flex-direction:column; gap:12px; color: white; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="row">
            <div class="color-btn active" style="background:var(--port-green)" onclick="selectColor('port', 'var(--port-green)', this)"></div>
            <div class="color-btn" style="background:var(--port-yellow)" onclick="selectColor('port', 'var(--port-yellow)', this)"></div>
            <div class="color-btn" style="border: 1px solid var(--glow-border); background:var(--glow-blue-dark);" onclick="selectColor('tile', 'var(--glow-blue-dark)', this)"></div>
            
            <button onclick="undo()">↩️</button>
            <button onclick="redo()">↪️</button>
            
            <button onclick="clearAll()" style="background:#c0392b">Ryd</button>
        </div>
        <div class="row">
            <input type="text" id="pIn" placeholder="Navn...">
            <button onclick="addI()" style="background:#e74c3c">✚ Tilføj</button>
        </div>
    </div>

    <div id="viewport"><div id="zoom-layer"><div id="grid"></div></div></div>

    <div id="modal"><div class="m-box">
        <h3 style="margin:0">Rediger</h3>
        <input type="text" id="eIn">
        <div class="row">
            <button onclick="saveE()" style="background:#27ae60; flex:1">Gem</button>
            <button onclick="delI()" style="background:#c0392b">Slet</button>
            <button onclick="closeM()">X</button>
        </div>
    </div></div>

    <script>
        const zl = document.getElementById('zoom-layer'), gd = document.getElementById('grid'), vp = document.getElementById('viewport');
        let sc = 1.0, px = 0, py = 0;
        
        // Stacks til historik
        let history = [];
        let redoStack = [];
        
        let curType = 'port', curColor = 'var(--port-green)';

        // --- Zoom & Pan (uændret for at bevare stabilitet) ---
        function applyTransform(zoomAtX, zoomAtY, newScale) {
            const oldScale = sc;
            sc = Math.max(0.2, Math.min(newScale, 4));
            px -= (zoomAtX - px) * (sc / oldScale - 1);
            py -= (zoomAtY - py) * (sc / oldScale - 1);
            zl.style.transform = `translate(${px}px, ${py}px) scale(${sc})`;
        }

        const hm = new Hammer(vp);
        hm.get('pinch').set({ enable: true });
        let sS = 1;
        hm.on('pinchstart', () => { sS = sc; });
        hm.on('pinchmove', (e) => { applyTransform(e.center.x, e.center.y, sS * e.scale); });
        hm.on('pan', (e) => { if (e.target !== gd && e.target !== vp) return; zl.style.transform = `translate(${px + e.deltaX}px, ${py + e.deltaY}px) scale(${sc})`; });
        hm.on('panend', (e) => { if (e.target !== gd && e.target !== vp) return; px += e.deltaX; py += e.deltaY; });

        function selectColor(t, c, el) { curType = t; curColor = c; document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }

        // --- Ny Logik til State Management ---
        function saveState(clearRedo = true) {
            const data = Array.from(document.querySelectorAll('.obj')).map(el => ({ 
                n: el.innerText, 
                t: el.dataset.t, 
                c: el.style.backgroundColor, 
                l: parseFloat(el.style.left), 
                top: parseFloat(el.style.top) 
            }));
            const stateString = JSON.stringify(data);
            
            // Hvis det er en ny handling, sletter vi redo-mulighederne
            if (clearRedo) redoStack = [];
            
            history.push(stateString);
            localStorage.setItem('dw_history_final', stateString);
        }

        function renderFromData(data) {
            gd.innerHTML = "";
            data.forEach(i => addI(i, false));
        }

        function undo() {
            if (history.length <= 1) return;
            // Flyt nuværende state til redo
            redoStack.push(history.pop());
            // Gendan forrige state
            renderFromData(JSON.parse(history[history.length - 1]));
        }

        function redo() {
            if (redoStack.length === 0) return;
            const state = redoStack.pop();
            history.push(state);
            renderFromData(JSON.parse(state));
        }

        // --- Element håndtering ---
        function addI(d = null, s = true) {
            const type = d ? d.t : curType;
            const name = d ? d.n : (document.getElementById('pIn').value || "");
            const color = d ? d.c : curColor;
            const dv = document.createElement('div');
            dv.className = `obj ${type === 'port' ? 'port' : 'tile-blue'}`;
            dv.dataset.t = type;
            if(type === 'port') dv.style.backgroundColor = color;
            dv.innerText = type === 'port' ? name : "";
            
            const rawX = d ? d.l : (window.innerWidth / 2 - px) / sc;
            const rawY = d ? d.top : (window.innerHeight / 2 - py) / sc;
            
            dv.style.left = (Math.floor(rawX / 20) * 20) + "px";
            dv.style.top = (Math.floor(rawY / 20) * 20) + "px";
            
            makeD(dv);
            let lt = 0; dv.addEventListener('touchend', () => { if(Date.now() - lt < 300) openM(dv); lt = Date.now(); });
            gd.appendChild(dv); 
            if (s) saveState();
        }

        function makeD(el) {
            let a = false, ox, oy, ix, iy;
            el.addEventListener("touchstart", (e) => { 
                e.stopPropagation(); 
                ox = parseFloat(el.style.left); 
                oy = parseFloat(el.style.top); 
                ix = e.touches[0].clientX / sc - ox; 
                iy = e.touches[0].clientY / sc - oy; 
                a = true; 
                el.classList.add('dragging');
            });
            el.addEventListener("touchend", () => { 
                if(!a) return; 
                a = false; 
                el.classList.remove('dragging');
                el.style.left = Math.round(parseFloat(el.style.left) / 20) * 20 + "px"; 
                el.style.top = Math.round(parseFloat(el.style.top) / 20) * 20 + "px"; 
                saveState(); 
            });
            el.addEventListener("touchmove", (e) => { 
                if (!a) return; 
                e.preventDefault(); 
                el.style.left = (e.touches[0].clientX / sc - ix) + "px"; 
                el.style.top = (e.touches[0].clientY / sc - iy) + "px"; 
            });
        }

        let cur = null;
        function openM(el) { cur = el; document.getElementById('eIn').value = el.innerText; document.getElementById('modal').style.display = 'flex'; }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        function saveE() { cur.innerText = document.getElementById('eIn').value; saveState(); closeM(); }
        function delI() { if(confirm("Slet?")) { cur.remove(); saveState(); closeM(); } }
        function clearAll() { if(confirm("Ryd alt?")) { localStorage.removeItem('dw_history_final'); location.reload(); } }

        window.onload = () => { 
            const d = localStorage.getItem('dw_history_final'); 
            if (d) { 
                history.push(d); 
                renderFromData(JSON.parse(d)); 
            } else {
                history.push("[]");
            }
            zl.style.transform = `translate(${px}px, ${py}px) scale(${sc})`;
        };
    </script>
</body>
</html>
