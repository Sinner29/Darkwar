<!DOCTYPE html>
<html>
<head>
    <title>Dark War - Hive Planner Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <style>
        :root { --header-bg: #2d2d2d; --accent: #e74c3c; }
        body { font-family: sans-serif; background: #111; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }

        /* Top Menu */
        .header { background: var(--header-bg); padding: 12px; border-bottom: 2px solid #444; z-index: 1000; }
        .row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        
        .color-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #555; cursor: pointer; }
        .active { border-color: white; transform: scale(1.15); box-shadow: 0 0 10px white; }
        
        input#nameInput { background: #1a1a1a; border: 1px solid #555; color: white; padding: 10px; border-radius: 6px; width: 130px; }
        button { background: #444; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-add { background: var(--accent); flex-grow: 1; max-width: 80px; }

        /* Zoom & Pan Område */
        #viewport { flex-grow: 1; position: relative; overflow: hidden; background: #000; cursor: grab; }
        #viewport:active { cursor: grabbing; }

        #container { 
            position: absolute; 
            transform-origin: 0 0; 
            will-change: transform;
        }

        #grid { 
            display: grid; 
            grid-template-columns: repeat(24, 40px); 
            grid-template-rows: repeat(24, 40px); 
            gap: 1px; 
            background: #333; 
            border: 2px solid #555;
        }

        .cell { 
            width: 40px; height: 40px; background: #222; 
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; position: relative;
        }

        .port-overlay { 
            position: absolute; width: 81px; height: 81px; 
            z-index: 10; display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.4); font-size: 11px;
            pointer-events: none; text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="row">
            <div class="color-dot active" style="background: #e1c699;" onclick="selectColor('#e1c699', this)"></div>
            <div class="color-dot" style="background: #222;" onclick="selectColor('#222', this)"></div>
            <div class="color-dot" style="background: white;" onclick="selectColor('white', this)"></div>
            <div class="color-dot" style="background: #6b8e23;" onclick="selectColor('#6b8e23', this)"></div>
            <button onclick="undo()">↩️</button>
            <button onclick="redo()">↪️</button>
            <button style="background:#c0392b" onclick="setTool('delete')">🗑️</button>
        </div>
        <div class="row">
            <input type="text" id="nameInput" placeholder="Name...">
            <button class="btn-add" onclick="setTool('add')">✚ Add</button>
        </div>
    </div>

    <div id="viewport">
        <div id="container">
            <div id="grid"></div>
        </div>
    </div>

    <script>
        let selectedColor = '#e1c699';
        let currentTool = 'add';
        let history = [];
        let redoStack = [];

        // Opsætning af Grid
        const grid = document.getElementById('grid');
        for (let i = 0; i < 24 * 24; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onpointerdown = (e) => { if(currentTool !== 'move') handleCellClick(i); };
            grid.appendChild(cell);
        }

        function selectColor(color, el) {
            selectedColor = color;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            currentTool = 'add';
        }

        function setTool(t) { currentTool = t; }

        function handleCellClick(index) {
            const name = document.getElementById('nameInput').value || "";
            const cell = grid.children[index];
            if (currentTool === 'delete') { saveState(); cell.innerHTML = ''; return; }
            saveState();
            const port = document.createElement('div');
            port.className = 'port-overlay';
            port.style.background = selectedColor;
            if(selectedColor === 'white') port.style.color = 'black';
            port.innerHTML = `<span>${name}</span>`;
            cell.appendChild(port);
        }

        function saveState() { history.push(grid.innerHTML); redoStack = []; }
        function undo() { if (history.length > 0) { redoStack.push(grid.innerHTML); grid.innerHTML = history.pop(); } }
        function redo() { if (redoStack.length > 0) { history.push(grid.innerHTML); grid.innerHTML = redoStack.pop(); } }

        // --- AVANCERET ZOOM & PAN LOGIK ---
        const viewport = document.getElementById('viewport');
        const container = document.getElementById('container');

        let scale = 1, x = 0, y = 0;
        let p1 = { x: 0, y: 0 }, p2 = { x: 0, y: 0 }, lastDist = 0;

        function updateTransform() {
            container.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        // Computer (Mus)
        viewport.onwheel = (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            scale = Math.min(Math.max(0.2, scale), 4);
            updateTransform();
        };

        // Mobil (Touch)
        viewport.ontouchmove = (e) => {
            if (e.touches.length === 1) { // Flyt (Pan)
                if (!p1.x) { p1 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; return; }
                x += e.touches[0].clientX - p1.x;
                y += e.touches[0].clientY - p1.y;
                p1 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) { // Zoom (Pinch)
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (lastDist) scale *= (d / lastDist);
                lastDist = d;
            }
            updateTransform();
        };

        viewport.ontouchend = () => { p1 = { x: 0, y: 0 }; lastDist = 0; };
        
        // Mus Drag (Pan)
        let isDragging = false;
        viewport.onmousedown = (e) => { if(e.button === 0) { isDragging = true; p1 = { x: e.clientX, y: e.clientY }; } };
        window.onmousemove = (e) => {
            if (!isDragging) return;
            x += e.clientX - p1.x;
            y += e.clientY - p1.y;
            p1 = { x: e.clientX, y: e.clientY };
            updateTransform();
        };
        window.onmouseup = () => isDragging = false;

        updateTransform();
    </script>
</body>
</html>
