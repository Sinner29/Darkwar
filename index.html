<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark War Tactical Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; background: #2c1e10; }
        .ui-panel {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(30, 20, 10, 0.9); padding: 15px;
            border-radius: 8px; border: 2px solid #f0c05a; color: #f0c05a;
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <strong>DARK WAR TACTICAL</strong>
        <div id="coords" style="font-size: 12px; color: #fff;">Klik for koordinater</div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Opsætning af kortet
        var map = L.map('map', { 
            crs: L.CRS.Simple, 
            minZoom: -3, 
            maxZoom: 5, 
            attributionControl: false 
        });

        // Her kobler vi koden til din map.jpg fil
        var bounds = [[0, 0], [1080, 1920]];
        var image = L.imageOverlay('map.jpg', bounds).addTo(map);
        map.fitBounds(bounds);

        // Marker funktion
        map.on('click', function(e) {
            var x = Math.round(e.latlng.lng);
            var y = Math.round(e.latlng.lat);
            document.getElementById('coords').innerHTML = "X: " + x + " | Y: " + y;
            
            var note = prompt("Navn/Alliance:");
            if (note) {
                L.circleMarker(e.latlng, { 
                    radius: 10, 
                    fillColor: "#f0c05a", 
                    color: "#000", 
                    weight: 2, 
                    fillOpacity: 0.9 
                }).addTo(map).bindPopup("<b>" + note + "</b><br>X: " + x + " Y: " + y).openPopup();
            }
        });
    </script>
</body>
</html>
