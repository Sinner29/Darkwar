<!DOCTYPE html>
<html>
<head>
    <title>Dark War Admin Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; background: #333; }
        #output { position: fixed; bottom: 10px; left: 10px; z-index: 1000; background: white; padding: 10px; max-height: 200px; overflow: auto; width: 300px; font-family: monospace; font-size: 10px; border: 2px solid orange; }
    </style>
</head>
<body>
    <div id="output">Klik 4 hjørner for at lave en zone...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Vi bruger målene fra dit billede (3476x4152)
        var bounds = [[0, 0], [3476, 4152]];
        var map = L.map('map', { crs: L.CRS.Simple, minZoom: -2 }).setView([1738, 2076], -1);
        L.imageOverlay('map.jpg', bounds).addTo(map);

        var tempCoords = [];
        var outputDiv = document.getElementById('output');
        var allZones = [];

        map.on('click', function(e) {
            var lat = Math.round(e.latlng.lat);
            var lng = Math.round(e.latlng.lng);
            tempCoords.push([lng, lat]);

            // Tegn en lille prik hvor du klikker
            L.circle([lat, lng], {radius: 20, color: 'red'}).addTo(map);

            if (tempCoords.length === 4) {
                // Vi har en firkant!
                var zoneName = prompt("Hvad hedder dette territorium? (f.eks. A1)");
                
                // Luk ringen (første og sidste punkt skal være ens i GeoJSON)
                var finalCoords = [tempCoords[0], tempCoords[1], tempCoords[2], tempCoords[3], tempCoords[0]];
                
                var feature = {
                    "type": "Feature",
                    "properties": { "name": zoneName, "alliance": "Ingen", "color": "#cccccc" },
                    "geometry": { "type": "Polygon", "coordinates": [finalCoords] }
                };

                allZones.push(feature);
                
                // Vis koden i boksen
                var fullGeoJSON = { "type": "FeatureCollection", "features": allZones };
                outputDiv.innerText = JSON.stringify(fullGeoJSON);
                
                // Tegn den færdige zone på kortet
                L.polygon([[tempCoords[0][1], tempCoords[0][0]], [tempCoords[1][1], tempCoords[1][0]], [tempCoords[2][1], tempCoords[2][0]], [tempCoords[3][1], tempCoords[3][0]]], {color: 'green'}).addTo(map);
                
                tempCoords = []; // Nulstil til næste zone
                alert("Zone " + zoneName + " tilføjet! Kopier teksten fra den hvide boks når du er færdig.");
            }
        });
    </script>
</body>
</html>
