<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark War - Precision Zoom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        :root { 
            --bg-color: #d8a06f; 
            --port-blue: #145a82;   
            --port-orange: #b35a00; 
            --shelter-blue: #0a3d59; 
            --shelter-orange: #8a4500; 
            --glow-blue: rgba(20, 90, 130, 0.45); 
            --glow-orange: rgba(179, 90, 0, 0.45); 
            --world-grey: #454d55; 
            --panel: #2d2d2d; 
            --grid-line: rgba(0,0,0,0.15); 
        }
        
        body { font-family:sans-serif; background:var(--bg-color); color:#333; margin:0; overflow:hidden; height:100vh; touch-action:none; }
        .controls { position:fixed; top:0; left:0; right:0; background:var(--panel); padding:10px; display:flex; flex-direction:column; gap:8px; z-index:1000; border-bottom:2px solid #555; }
        .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content: center; }
        
        input, button { padding:8px 10px; border-radius:4px; border:none; font-size:11px; background:#444; color:white; cursor: pointer; }
        .btn-group { display: flex; gap: 2px; }
        
        .color-btn { width: 30px; height: 30px; border: 2px solid transparent; cursor: pointer; box-sizing: border-box; }
        .color-btn.active { border-color: white; }

        #viewport { width:100vw; height:100vh; position:relative; background: var(--bg-color); overflow: hidden; }
        #zoom-layer { position:absolute; transform-origin: 0 0; width:5000px; height:5000px; will-change: transform; }
        #grid { width:100%; height:100%; background-size: 20px 20px; background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); }

        .obj { 
            position:absolute; display:flex; flex-direction: column; align-items:center; justify-content:center; 
            font-size:8px; font-weight: 600; color: #fff; text-align:center; z-index:10; 
            text-shadow: 1px 1px 2px #000; outline: 1px solid rgba(255,255,255,0.1);
        }
        .zone { width:20px; height:20px; background: rgba(0,0,0,0.4); z-index: 5; }
        .port { width:40px; height:40px; }
        .port::before { content: "PORTAL"; font-size: 6px; margin-bottom: 1px; }
        .shelter { width:60px; height:60px; }
        .tile-blue { width:20px; height:20px; background: var(--glow-blue); }
        .tile-orange { width:20px; height:20px; background: var(--glow-orange); }
        .pyramid { width:140px; height:140px; background: var(--world-grey); }

        #modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:2000; display:none; align-items:center; justify-content:center; }
        .m-box { background:#333; padding:20px; border-radius:10px; color: white; display:flex; flex-direction:column; gap:10px; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="row">
            <div class="color-btn active" style="background:var(--port-blue)" onclick="selectType('port', 'var(--port-blue)', this)"></div>
            <div class="color-btn" style="background:var(--port-orange)" onclick="selectType('port', 'var(--port-orange)', this)"></div>
            <div class="color-btn" style="background:var(--glow-blue); border:1px solid var(--port-blue)" onclick="selectType('tile-blue', 'var(--glow-blue)', this)"></div>
            <div class="color-btn" style="background:var(--glow-orange); border:1px solid var(--port-orange)" onclick="selectType('tile-orange', 'var(--glow-orange)', this)"></div>
            <div class="color-btn" style="background:#000" onclick="selectType('zone', '', this)"></div>
            <button id="lockBtn" onclick="toggleLock()" style="background:#27ae60">🔓 Lock</button>
            <button onclick="exportMap()" style="background:#8e44ad">📤 Export</button>
            <button onclick="importMap()" style="background:#2980b9">📥 Import</button>
        </div>
        <div class="row">
            <div class="btn-group">
                <button onclick="undo()">↩️</button>
                <button onclick="redo()">↪️</button>
            </div>
            <button onclick="addSpecial('pyramid', 'PYRAMID')">🏜️</button>
            <button onclick="addSpecial('shelter', '', 'var(--shelter-blue)')" style="background:var(--shelter-blue)">🏠 B</button>
            <button onclick="addSpecial('shelter', '', 'var(--shelter-orange)')" style="background:var(--shelter-orange)">🏠 O</button>
            <input type="text" id="pIn" placeholder="Navn..." style="width:70px">
            <button onclick="addI()" style="background:#e74c3c">✚</button>
            <button onclick="clearAll()" style="background:#c0392b">Ryd</button>
        </div>
    </div>

    <div id="viewport"><div id="zoom-layer"><div id="grid"></div></div></div>

    <div id="modal"><div class="m-box">
        <input type="text" id="eIn">
        <div class="row">
            <button onclick="saveE()" style="background:#27ae60">Gem</button>
            <button onclick="delI()" style="background:#c0392b">Slet</button>
            <button onclick="closeM()">X</button>
        </div>
    </div></div>

    <script>
        const zl = document.getElementById('zoom-layer'), gd = document.getElementById('grid'), vp = document.getElementById('viewport');
        let sc = 1.0, px = 0, py = 0, history = [], redoStack = [], curType = 'port', curColor = 'var(--port-blue)', terrainLocked = false;

        const cMap = { 'var(--port-blue)': 1, 'var(--port-orange)': 2, 'var(--shelter-blue)': 3, 'var(--shelter-orange)': 4, 'var(--glow-blue)': 5, 'var(--glow-orange)': 6, 'rgba(0, 0, 0, 0.4)': 7 };
        const rCMap = { 1: 'var(--port-blue)', 2: 'var(--port-orange)', 3: 'var(--shelter-blue)', 4: 'var(--shelter-orange)', 5: 'var(--glow-blue)', 6: 'var(--glow-orange)', 7: 'rgba(0, 0, 0, 0.4)' };
        const tMap = { 'port': 'p', 'shelter': 's', 'pyramid': 'y', 'zone': 'z', 'tile-blue': 'b', 'tile-orange': 'o' };
        const rTMap = { 'p': 'port', 's': 'shelter', 'y': 'pyramid', 'z': 'zone', 'b': 'tile-blue', 'o': 'tile-orange' };

        function updateTransform() { zl.style.transform = `translate(${px}px, ${py}px) scale(${sc})`; }

        async function exportMap() {
            const data = Array.from(document.querySelectorAll('.obj')).map(el => [
                el.innerText || 0,
                tMap[el.dataset.t],
                cMap[el.style.backgroundColor] || el.style.backgroundColor,
                parseInt(el.style.left)/20,
                parseInt(el.style.top)/20
            ]);
            const code = btoa(JSON.stringify(data));
            await navigator.clipboard.writeText(code);
            alert("Kopieret!");
        }

        function importMap() {
            const code = prompt("Indsæt kode:");
            if (!code) return;
            try {
                const decoded = JSON.parse(atob(code));
                gd.innerHTML = "";
                decoded.forEach(i => addI({ n: i[0]==0?"":i[0], t: rTMap[i[1]], c: rCMap[i[2]] || i[2], l: i[3]*20, top: i[4]*20 }, false));
                saveState();
            } catch (e) { alert("Fejl!"); }
        }

        // --- FORBEDRET ZOOM LOGIK ---
        const hm = new Hammer(vp);
        hm.get('pinch').set({ enable: true });
        let startSc, startPx, startPy, centerX, centerY;

        hm.on('pinchstart', (e) => {
            startSc = sc;
            startPx = px;
            startPy = py;
            centerX = e.center.x;
            centerY = e.center.y;
        });

        hm.on('pinchmove', (e) => {
            const newSc = Math.max(0.2, Math.min(startSc * e.scale, 4));
            const ratio = newSc / startSc;
            
            // Beregn ny position baseret på center af fingrene
            px = centerX - (centerX - startPx) * ratio;
            py = centerY - (centerY - startPy) * ratio;
            sc = newSc;
            
            requestAnimationFrame(updateTransform);
        });

        hm.on('panmove', (e) => {
            if (e.target === gd || e.target === vp) {
                zl.style.transform = `translate(${px + e.deltaX}px, ${py + e.deltaY}px) scale(${sc})`;
            }
        });

        hm.on('panend', (e) => {
            if (e.target === gd || e.target === vp) {
                px += e.deltaX; py += e.deltaY; updateTransform();
            }
        });

        function selectType(t, c, el) { curType = t; curColor = c; document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }

        function saveState(clearRedo = true) {
            const data = Array.from(document.querySelectorAll('.obj')).map(el => ({ n: el.innerText, t: el.dataset.t, c: el.style.backgroundColor, l: parseInt(el.style.left), top: parseInt(el.style.top) }));
            history.push(JSON.stringify(data));
            if (clearRedo) redoStack = [];
            localStorage.setItem('dw_save', JSON.stringify(data));
        }

        function undo() {
            if (history.length <= 1) return;
            redoStack.push(history.pop());
            render(JSON.parse(history[history.length - 1]));
        }

        function redo() {
            if (redoStack.length === 0) return;
            const state = redoStack.pop();
            history.push(state);
            render(JSON.parse(state));
        }

        function render(data) {
            gd.innerHTML = "";
            data.forEach(i => addI(i, false));
        }

        function addI(d = null, s = true) {
            const type = d ? d.t : curType;
            const x = d ? d.l : 1000, y = d ? d.top : 1000;
            const dv = document.createElement('div');
            dv.className = `obj ${type}`;
            dv.dataset.t = type;
            dv.style.backgroundColor = d ? d.c : curColor;
            dv.innerText = d ? d.n : document.getElementById('pIn').value;
            dv.style.left = x + "px"; dv.style.top = y + "px";
            makeD(dv);
            let lt = 0; dv.addEventListener('touchend', () => { if(Date.now() - lt < 300) openM(dv); lt = Date.now(); });
            gd.appendChild(dv); 
            if (s) saveState();
        }

        function makeD(el) {
            let a = false, ix, iy;
            el.addEventListener("touchstart", (e) => { 
                if (el.classList.contains('zone') && terrainLocked) return;
                ix = e.touches[0].clientX / sc - parseInt(el.style.left); iy = e.touches[0].clientY / sc - parseInt(el.style.top); a = true; 
            });
            el.addEventListener("touchend", () => { 
                if(!a) return; a = false; 
                el.style.left = Math.round(parseInt(el.style.left) / 20) * 20 + "px";
                el.style.top = Math.round(parseInt(el.style.top) / 20) * 20 + "px";
                saveState();
            });
            el.addEventListener("touchmove", (e) => { if (!a) return; e.preventDefault(); el.style.left = (e.touches[0].clientX / sc - ix) + "px"; el.style.top = (e.touches[0].clientY / sc - iy) + "px"; });
        }

        function toggleLock() { terrainLocked = !terrainLocked; document.getElementById('lockBtn').innerHTML = terrainLocked ? "🔒 Locked" : "🔓 Lock"; }
        function openM(el) { cur = el; document.getElementById('eIn').value = el.innerText; document.getElementById('modal').style.display = 'flex'; }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        function saveE() { cur.innerText = document.getElementById('eIn').value; saveState(); closeM(); }
        function delI() { cur.remove(); saveState(); closeM(); }
        function clearAll() { if(confirm("Ryd alt?")) { gd.innerHTML = ""; saveState(); } }

        window.onload = () => { 
            const d = localStorage.getItem('dw_save'); 
            if (d) { render(JSON.parse(d)); history.push(d); } else history.push("[]");
            updateTransform();
        };
    </script>
</body>
</html>
