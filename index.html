<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark War - Oasis Resize</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        :root { 
            --bg-color: #d8a06f; 
            --port-blue: #145a82;   
            --port-orange: #b35a00; 
            --shelter-blue: #0a3d59; 
            --shelter-orange: #8a4500; 
            --world-grey: #454d55; 
            --panel: #2d2d2d; 
            --grid-line: rgba(0,0,0,0.15); 
        }
        
        body { font-family:sans-serif; background:var(--bg-color); color:#333; margin:0; overflow:hidden; height:100vh; touch-action:none; }
        .controls { position:fixed; top:0; left:0; right:0; background:var(--panel); padding:10px; display:flex; flex-direction:column; gap:8px; z-index:1000; border-bottom:2px solid #555; }
        .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content: center; }
        
        input, button { padding:8px 10px; border-radius:4px; border:none; font-size:11px; background:#444; color:white; cursor: pointer; }
        
        .color-btn { width: 30px; height: 30px; border: 2px solid transparent; cursor: pointer; box-sizing: border-box; }
        .color-btn.active { border-color: white; }

        #viewport { width:100vw; height:100vh; position:relative; background: var(--bg-color); overflow: hidden; }
        #zoom-layer { position:absolute; transform-origin: 0 0; width:5000px; height:5000px; will-change: transform; }
        #grid { width:100%; height:100%; background-size: 20px 20px; background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); }

        .obj { 
            position:absolute; display:flex; flex-direction: column; align-items:center; justify-content:center; 
            font-size:8px; font-weight: 600; color: #fff; text-align:center; z-index:10; 
            text-shadow: 1px 1px 2px #000; outline: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;
        }

        .zone { width:20px; height:20px; background: rgba(0,0,0,0.4); z-index: 5; outline: none; }
        .port { width:40px; height:40px; }
        .port::before { content: "PORTAL"; font-size: 6px; margin-bottom: 1px; }
        .shelter { width:60px; height:60px; }
        
        .pyramid { width:140px; height:140px; background: var(--world-grey); }
        .pyramid::before { content: "PYRAMID"; }
        .stronghold { width:100px; height:100px; background: var(--world-grey); }
        .stronghold::before { content: "STRONGHOLD"; }
        .oasis { width:100px; height:100px; background: var(--world-grey); }
        .oasis::before { content: "OASIS"; }

        .tile-blue { width:20px; height:20px; background: rgba(20, 90, 130, 0.45); }
        .tile-orange { width:20px; height:20px; background: rgba(179, 90, 0, 0.45); }

        #modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:2000; display:none; align-items:center; justify-content:center; }
        .m-box { background:#333; padding:20px; border-radius:10px; color: white; display:flex; flex-direction:column; gap:10px; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="row">
            <div class="color-btn active" style="background:#145a82" onclick="selectType('port', '#145a82', this)"></div>
            <div class="color-btn" style="background:#b35a00" onclick="selectType('port', '#b35a00', this)"></div>
            <div class="color-btn" style="background:rgba(20, 90, 130, 0.45); border:1px solid #145a82" onclick="selectType('tile-blue', 'rgba(20, 90, 130, 0.45)', this)"></div>
            <div class="color-btn" style="background:rgba(179, 90, 0, 0.45); border:1px solid #b35a00" onclick="selectType('tile-orange', 'rgba(179, 90, 0, 0.45)', this)"></div>
            <div class="color-btn" style="background:rgba(0,0,0,0.6);" onclick="selectType('zone', '', this)"></div>
            <button id="lockBtn" onclick="toggleLock()" style="background:#27ae60">🔓 Lock</button>
            <button onclick="exportMap()" style="background:#8e44ad">📤 Export</button>
            <button onclick="importMap()" style="background:#2980b9">📥 Import</button>
        </div>
        <div class="row">
            <button onclick="undo()">↩️</button>
            <button onclick="redo()">↪️</button>
            <button onclick="addSpecial('pyramid', '')">🏜️ Pyr</button>
            <button onclick="addSpecial('stronghold', '')">🏰 Str</button>
            <button onclick="addSpecial('oasis', '')">💧 Oas</button>
            <button onclick="addSpecial('shelter', '', '#0a3d59')" style="background:#0a3d59">🏠 B</button>
            <button onclick="addSpecial('shelter', '', '#8a4500')" style="background:#8a4500">🏠 O</button>
            <input type="text" id="pIn" placeholder="Label..." style="width:60px">
            <button onclick="addI()" style="background:#e74c3c">✚ Add</button>
            <button onclick="clearAll()" style="background:#c0392b">Clear</button>
        </div>
    </div>

    <div id="viewport"><div id="zoom-layer"><div id="grid"></div></div></div>

    <div id="modal"><div class="m-box">
        <input type="text" id="eIn">
        <div class="row">
            <button onclick="saveE()" style="background:#27ae60">Save</button>
            <button onclick="delI()" style="background:#c0392b">Delete</button>
            <button onclick="closeM()">X</button>
        </div>
    </div></div>

    <script>
        const zl = document.getElementById('zoom-layer'), gd = document.getElementById('grid'), vp = document.getElementById('viewport');
        let sc = 1.0, px = 0, py = 0, history = [], redoStack = [], curType = 'port', curColor = '#145a82', terrainLocked = false;

        function updateTransform() { zl.style.transform = `translate(${px}px, ${py}px) scale(${sc})`; }

        function isBlocked(x, y, type) {
            if (type === 'zone') return false;
            const sizeMap = { 'port': 40, 'shelter': 60, 'pyramid': 140, 'stronghold': 100, 'oasis': 100, 'tile-blue': 20, 'tile-orange': 20 };
            const size = sizeMap[type] || 20;
            const zones = Array.from(document.querySelectorAll('.zone'));
            for (let ox = 0; ox < size; ox += 20) {
                for (let oy = 0; oy < size; oy += 20) {
                    if (zones.some(z => parseInt(z.style.left) === x + ox && parseInt(z.style.top) === y + oy)) return true;
                }
            }
            return false;
        }

        // OPTIMERET EKSPORT (MEGET KORTERE)
        async function exportMap() {
            const data = Array.from(document.querySelectorAll('.obj')).map(el => [
                el.innerText, 
                el.dataset.t, 
                el.style.backgroundColor, 
                parseInt(el.style.left), 
                parseInt(el.style.top)
            ]);
            const code = btoa(JSON.stringify(data));
            await navigator.clipboard.writeText(code);
            alert("Kortere eksport-kode kopieret!");
        }

        function importMap() {
            const code = prompt("Indsæt din korte kode:");
            if (!code) return;
            try {
                const decoded = JSON.parse(atob(code));
                gd.innerHTML = "";
                decoded.forEach(i => {
                    // Håndterer både det gamle og det nye korte format
                    const item = Array.isArray(i) ? { n: i[0], t: i[1], c: i[2], l: i[3], top: i[4] } : { n: i.n, t: i.t, c: i.c, l: i.l, top: i.top };
                    addI(item, false);
                });
                saveState();
            } catch (e) { alert("Ugyldig kode!"); }
        }

        const hm = new Hammer(vp);
        hm.get('pinch').set({ enable: true });
        let startSc, startPx, startPy, cX, cY;
        hm.on('pinchstart', (e) => { startSc = sc; startPx = px; startPy = py; cX = e.center.x; cY = e.center.y; });
        hm.on('pinchmove', (e) => {
            const newSc = Math.max(0.1, Math.min(startSc * e.scale, 5));
            const ratio = newSc / startSc;
            px = cX - (cX - startPx) * ratio; 
            py = cY - (cY - startPy) * ratio; 
            sc = newSc;
            updateTransform();
        });
        hm.on('panmove', (e) => { if (e.target === gd || e.target === vp) zl.style.transform = `translate(${px + e.deltaX}px, ${py + e.deltaY}px) scale(${sc})`; });
        hm.on('panend', (e) => { if (e.target === gd || e.target === vp) { px += e.deltaX; py += e.deltaY; updateTransform(); } });

        function selectType(t, c, el) { curType = t; curColor = c; document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }

        function saveState(clearRedo = true) {
            const data = Array.from(document.querySelectorAll('.obj')).map(el => ({ n: el.innerText, t: el.dataset.t, c: el.style.backgroundColor, l: parseInt(el.style.left), top: parseInt(el.style.top) }));
            history.push(JSON.stringify(data));
            if (clearRedo) redoStack = [];
            localStorage.setItem('dw_final_save', JSON.stringify(data));
        }

        function addSpecial(type, name, color = null) { 
            addI({ n: name, t: type, c: color || "", l: null, top: null }); 
        }

        function addI(d = null, s = true) {
            const type = d ? d.t : curType;
            const rawX = (d && d.l !== null) ? d.l : (window.innerWidth/2 - px)/sc - 20;
            const rawY = (d && d.top !== null) ? d.top : (window.innerHeight/2 - py)/sc - 20;
            const x = Math.round(rawX/20)*20, y = Math.round(rawY/20)*20;

            if (!d && isBlocked(x, y, type)) { alert("Area blocked!"); return; }

            const dv = document.createElement('div');
            dv.className = `obj ${type}`;
            dv.dataset.t = type;
            dv.style.backgroundColor = d ? d.c : (type === 'zone' ? '' : curColor);
            dv.innerText = (type === 'zone') ? "" : (d ? d.n : document.getElementById('pIn').value);
            dv.style.left = x + "px"; dv.style.top = y + "px";
            
            makeD(dv);
            let lt = 0; dv.addEventListener('touchend', () => { if(Date.now() - lt < 300) openM(dv); lt = Date.now(); });
            gd.appendChild(dv); 
            if (s) saveState();
        }

        function makeD(el) {
            let a = false, ox, oy, startX, startY;
            el.addEventListener("touchstart", (e) => { 
                if (terrainLocked && el.dataset.t === 'zone') return;
                startX = parseInt(el.style.left); startY = parseInt(el.style.top);
                ox = e.touches[0].clientX / sc - startX; oy = e.touches[0].clientY / sc - startY; a = true; 
            });
            el.addEventListener("touchend", () => { 
                if(!a) return; a = false; 
                const nx = parseInt(el.style.left), ny = parseInt(el.style.top);
                if (isBlocked(nx, ny, el.dataset.t)) { el.style.left = startX + "px"; el.style.top = startY + "px"; }
                saveState(); 
            });
            el.addEventListener("touchmove", (e) => { 
                if (!a) return; e.preventDefault(); 
                el.style.left = Math.round((e.touches[0].clientX / sc - ox)/20)*20 + "px";
                el.style.top = Math.round((e.touches[0].clientY / sc - oy)/20)*20 + "px";
            });
        }

        function toggleLock() { terrainLocked = !terrainLocked; document.getElementById('lockBtn').innerHTML = terrainLocked ? "🔒 Locked" : "🔓 Lock"; }
        function undo() { if (history.length <= 1) return; redoStack.push(history.pop()); render(JSON.parse(history[history.length - 1])); }
        function redo() { if (redoStack.length === 0) return; const state = redoStack.pop(); history.push(state); render(JSON.parse(state)); }
        function render(data) { gd.innerHTML = ""; data.forEach(i => addI(i, false)); }
        let cur = null;
        function openM(el) { cur = el; document.getElementById('eIn').value = el.innerText; document.getElementById('modal').style.display = 'flex'; }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        function saveE() { cur.innerText = document.getElementById('eIn').value; saveState(); closeM(); }
        function delI() { cur.remove(); saveState(); closeM(); }
        function clearAll() { if(confirm("Clear everything?")) { gd.innerHTML = ""; saveState(); } }

        window.onload = () => { 
            const d = localStorage.getItem('dw_final_save'); 
            if (d) { render(JSON.parse(d)); history.push(d); } else history.push("[]");
            updateTransform();
        };
    </script>
</body>
</html>
