<!DOCTYPE html>
<html>
<head>
    <title>Dark War - Drag & Drop Hive Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <style>
        :root { --header-bg: #2d2d2d; --accent: #e74c3c; }
        body { font-family: sans-serif; background: #0a0a0a; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }

        .header { background: var(--header-bg); padding: 10px; border-bottom: 2px solid #444; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
        
        .color-picker-wrapper { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; border: 2px solid white; position: relative; }
        #colorPicker { position: absolute; top: -5px; left: -5px; width: 50px; height: 50px; cursor: pointer; }
        
        input#nameInput { background: #1a1a1a; border: 1px solid #555; color: white; padding: 10px; border-radius: 6px; flex-grow: 1; max-width: 150px; }
        button { background: #444; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-add { background: var(--accent); }

        #viewport { flex-grow: 1; position: relative; overflow: hidden; background: #000; }
        #container { position: absolute; transform-origin: 0 0; will-change: transform; }

        #grid { 
            display: grid; 
            grid-template-columns: repeat(100, 40px); 
            grid-template-rows: repeat(100, 40px); 
            gap: 1px; 
            background: #222; 
        }

        .cell { width: 40px; height: 40px; background: #111; position: relative; border: 0.1px solid #1a1a1a; }

        .port-overlay { 
            position: absolute; width: 81px; height: 81px; 
            z-index: 10; display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.3); font-size: 11px; font-weight: bold;
            text-align: center; color: white; text-shadow: 1px 1px 2px black;
            cursor: grab; user-select: none; touch-action: none;
        }
        .port-overlay:active { cursor: grabbing; opacity: 0.7; z-index: 100; }
    </style>
</head>
<body>

    <div class="header">
        <div class="row">
            <div class="color-picker-wrapper"><input type="color" id="colorPicker" value="#e1c699"></div>
            <button onclick="undo()">↩️</button>
            <button onclick="redo()">↪️</button>
            <button style="background:#c0392b" onclick="setTool('delete')">🗑️</button>
        </div>
        <div class="row">
            <input type="text" id="nameInput" placeholder="Navn...">
            <button class="btn-add" id="addBtn" onclick="setTool('add')">✚ Add</button>
        </div>
    </div>

    <div id="viewport">
        <div id="container">
            <div id="grid"></div>
        </div>
    </div>

    <script>
        let currentTool = 'add';
        let history = [];
        let redoStack = [];
        let scale = 0.8, posX = 20, posY = 20;
        
        // Build Grid
        const grid = document.getElementById('grid');
        for (let i = 0; i < 100 * 100; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'idx-' + i;
            grid.appendChild(cell);
        }

        function setTool(t) { currentTool = t; }

        function createPort(targetCell, name, color) {
            const port = document.createElement('div');
            port.className = 'port-overlay';
            port.style.background = color;
            port.innerHTML = `<span>${name}</span>`;
            
            // Drag Logic for Port
            let isDraggingPort = false;
            
            port.onpointerdown = (e) => {
                if (currentTool === 'delete') {
                    saveState();
                    port.remove();
                    return;
                }
                e.stopPropagation();
                isDraggingPort = true;
                port.setPointerCapture(e.pointerId);
            };

            port.onpointermove = (e) => {
                if (!isDraggingPort) return;
                // Midlertidig visuel flytning
                const rect = grid.getBoundingClientRect();
                const x = (e.clientX - rect.left) / scale - 40;
                const y = (e.clientY - rect.top) / scale - 40;
                port.style.left = x + 'px';
                port.style.top = y + 'px';
            };

            port.onpointerup = (e) => {
                if (!isDraggingPort) return;
                isDraggingPort = false;
                
                // Find nærmeste celle ved slip
                const rect = grid.getBoundingClientRect();
                const col = Math.round(((e.clientX - rect.left) / scale - 40) / 41);
                const row = Math.round(((e.clientY - rect.top) / scale - 40) / 41);
                const newCell = document.getElementById('idx-' + (row * 100 + col));
                
                if (newCell) {
                    saveState();
                    port.style.left = '0';
                    port.style.top = '0';
                    newCell.appendChild(port);
                } else {
                    port.style.left = '0';
                    port.style.top = '0';
                }
            };

            targetCell.appendChild(port);
        }

        // Viewport Interaction (Pan & Zoom)
        const viewport = document.getElementById('viewport');
        const container = document.getElementById('container');
        let isPanning = false;
        let startX, startY;

        viewport.onpointerdown = (e) => {
            if (e.target.className === 'cell' && currentTool === 'add') {
                const id = e.target.id.split('-')[1];
                saveState();
                createPort(e.target, document.getElementById('nameInput').value, document.getElementById('colorPicker').value);
            } else {
                isPanning = true;
                startX = e.clientX - posX;
                startY = e.clientY - posY;
            }
        };

        window.onpointermove = (e) => {
            if (!isPanning) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            container.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        };

        window.onpointerup = () => { isPanning = false; };

        viewport.onwheel = (e) => {
            e.preventDefault();
            scale *= (e.deltaY > 0 ? 0.9 : 1.1);
            scale = Math.max(0.1, Math.min(scale, 5));
            container.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        };

        function saveState() { history.push(grid.innerHTML); redoStack = []; }
        function undo() { if (history.length > 0) { redoStack.push(grid.innerHTML); grid.innerHTML = history.pop(); } }
        function redo() { if (redoStack.length > 0) { history.push(grid.innerHTML); grid.innerHTML = redoStack.pop(); } }

        container.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    </script>
</body>
</html>
