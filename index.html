<!DOCTYPE html>
<html>
<head>
    <title>Dark War - Professional Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        
        .controls { 
            margin-bottom: 15px; padding: 15px; background: #222; 
            border-radius: 12px; position: sticky; top: 0; z-index: 100;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
        }

        #grid { 
            display: grid; 
            grid-template-columns: repeat(24, 1fr); 
            gap: 1px; 
            background: #333; 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto;
            border: 2px solid #444;
        }

        .cell { 
            aspect-ratio: 1 / 1; 
            background: #1e1e1e; 
            cursor: pointer; 
            display: flex;
            align-items: center; 
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: white;
            position: relative;
        }

        /* Port Styles */
        .port { position: absolute; width: 200%; height: 200%; z-index: 5; display: flex; align-items: center; justify-content: center; text-align: center; pointer-events: auto; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.2); }
        .port-blue { background: #2980b9; }
        .port-yellow { background: #f1c40f; color: black; }
        .port-orange { background: #e67e22; }
        
        /* Tile Style */
        .tile-blue { background: rgba(52, 152, 219, 0.4) !important; border: 1px solid #3498db; }

        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .active { outline: 3px solid white; transform: scale(1.05); }
        
        .btn-blue { background: #2980b9; color: white; }
        .btn-yellow { background: #f1c40f; color: black; }
        .btn-orange { background: #e67e22; color: white; }
        .btn-tile { background: rgba(52, 152, 219, 0.6); color: white; }
        .btn-del { background: #c0392b; color: white; }

        input { background: rgba(255,255,255,0.9); border: none; width: 80%; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="controls">
        <button id="p-blue" class="btn-blue active" onclick="setMode('port', '#2980b9', 'blue')">Port Blå</button>
        <button id="p-yellow" class="btn-yellow" onclick="setMode('port', '#f1c40f', 'yellow')">Port Gul</button>
        <button id="p-orange" class="btn-orange" onclick="setMode('port', '#e67e22', 'orange')">Port Orange</button>
        <button id="p-tile" class="btn-tile" onclick="setMode('tile')">Blå Tile</button>
        <button class="btn-del" onclick="setMode('delete')">Slet</button>
    </div>

    <div id="grid"></div>

    <script>
        let mode = 'port';
        let currentColor = '#2980b9';
        let colorName = 'blue';
        const gridSize = 24;

        const grid = document.getElementById('grid');
        for (let i = 0; i < gridSize * gridSize; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'cell-' + i;
            cell.onclick = (e) => handleInteraction(i);
            grid.appendChild(cell);
        }

        function setMode(newMode, color, cName) {
            mode = newMode;
            if(color) { currentColor = color; colorName = cName; }
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function handleInteraction(index) {
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const cell = document.getElementById('cell-' + index);

            if (mode === 'delete') {
                if(cell.innerHTML.includes('port')) {
                    // Hvis det er en port, skal vi rydde de 4 felter
                    removePort(index);
                } else {
                    cell.className = 'cell';
                    cell.innerHTML = '';
                }
                return;
            }

            if (mode === 'tile') {
                cell.className = 'cell tile-blue';
                return;
            }

            if (mode === 'port') {
                if (row < gridSize - 1 && col < gridSize - 1) {
                    createPort(index);
                }
            }
        }

        function createPort(index) {
            const cell = document.getElementById('cell-' + index);
            // Vi laver porten som et element der dækker 2x2
            const portDiv = document.createElement('div');
            portDiv.className = `port port-${colorName}`;
            portDiv.innerText = "NAVNE";
            
            // Dobbeltklik for at ændre navn
            portDiv.ondblclick = (e) => {
                e.stopPropagation();
                let currentName = portDiv.innerText;
                let input = document.createElement('input');
                input.value = currentName;
                portDiv.innerHTML = '';
                portDiv.appendChild(input);
                input.focus();
                input.onblur = () => { portDiv.innerText = input.value || "NAVNE"; };
                input.onkeydown = (ev) => { if(ev.key === 'Enter') input.blur(); };
            };

            cell.appendChild(portDiv);
        }

        function removePort(index) {
            const cell = document.getElementById('cell-' + index);
            cell.innerHTML = '';
        }
    </script>
</body>
</html>
